<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>اهزم المحصّن</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 0,#3b2a57,#090b16 65%);color:#fff;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:manipulation}
.game{width:min(920px,95vw);text-align:center}
h1{font-size:clamp(34px,8vw,64px);margin:0;font-weight:900;text-shadow:0 4px 20px #000}
.subtitle{color:#c9c5d8;font-size:17px;margin:4px 0 22px}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:#ffffff0d;border:1px solid #ffffff1c;border-radius:22px;padding:18px;box-shadow:0 12px 35px #0007}
.title{font-size:21px;font-weight:800;margin-bottom:10px}
.bar{height:28px;background:#151525;border-radius:99px;overflow:hidden;border:2px solid #ffffff18}
.fill{height:100%;width:0%;transition:width .06s}
.player{background:linear-gradient(90deg,#19d3ff,#6b5cff)}
.enemy{background:linear-gradient(90deg,#ff355e,#ff9d2e)}
.percent{font-size:28px;font-weight:900;margin-top:8px}
.stats{color:#bbb9c9}
#tap{width:185px;height:185px;border-radius:50%;margin:25px auto 12px;border:5px solid #ffffff30;background:radial-gradient(circle,#8d5cff,#39208e);display:flex;align-items:center;justify-content:center;font-size:94px;font-weight:900;box-shadow:0 12px 0 #1d1741,0 20px 55px #0009;user-select:none;cursor:pointer;touch-action:manipulation}
#tap.down{transform:translateY(9px);box-shadow:0 3px 0 #1d1741,0 10px 25px #0009}
#status{font-size:19px;min-height:27px;color:#eee}
#result{font-size:37px;font-weight:900;margin:12px 0}
button{border:0;border-radius:13px;padding:13px 26px;font-size:17px;font-weight:800;cursor:pointer}
.hint{font-size:14px;color:#8f8da2;margin-top:14px}
.flash{animation:flash .12s}
@keyframes flash{50%{filter:brightness(1.8)}}
@media(max-width:650px){.arena{grid-template-columns:1fr 1fr}.card{padding:12px}.title{font-size:17px}#tap{width:160px;height:160px;font-size:82px}.subtitle{font-size:14px}}
</style>
</head>
<body>
<main class="game">
<h1>🛡️ اهزم المحصّن</h1>
<div class="subtitle">المحصّن سريع جدًا... هل تستطيع الضغط أسرع منه؟</div>

<section class="arena">
<div class="card">
<div class="title">⚔️ أنت</div>
<div class="bar"><div id="pf" class="fill player"></div></div>
<div class="percent"><span id="pp">0</span>%</div>
<div class="stats">ضغطات: <span id="ph">0</span></div>
</div>
<div class="card">
<div class="title">🛡️ المحصّن</div>
<div class="bar"><div id="ef" class="fill enemy"></div></div>
<div class="percent"><span id="ep">0</span>%</div>
<div class="stats">ضغطات: <span id="eh">0</span></div>
</div>
</section>

<div id="tap">E</div>
<div id="status">اضغط زر E لبدء القتال!</div>
<div id="result"></div>
<button id="again" style="display:none" onclick="start()">🔄 إعادة القتال</button>
<div class="hint">💻 الكمبيوتر: اضغط E من الكيبورد &nbsp; | &nbsp; 📱 الجوال: اضغط الزر E بسرعة</div>
</main>

<script>
let playing=false,power=0,enemy=0,hits=0,ehits=0,last=0,timer;
const pf=document.getElementById('pf'),ef=document.getElementById('ef');
const pp=document.getElementById('pp'),ep=document.getElementById('ep');
const ph=document.getElementById('ph'),eh=document.getElementById('eh');
const status=document.getElementById('status'),result=document.getElementById('result');
const tap=document.getElementById('tap'),again=document.getElementById('again');

function update(){
 pf.style.width=power+'%';ef.style.width=enemy+'%';
 pp.textContent=Math.floor(power);ep.textContent=Math.floor(enemy);
 ph.textContent=hits;eh.textContent=ehits;
}
function end(w){
 playing=false;clearTimeout(timer);
 result.textContent=w==='you'?'🏆 هزمت المحصّن!':'💀 المحصّن هزمك!';
 status.textContent=w==='you'?'🔥 سرعتك كانت جنونية!':'🛡️ المحصّن كان أسرع منك!';
 again.style.display='inline-block';
}
function enemyHit(){
 if(!playing)return;
 ehits++;
 // Very fast and intentionally difficult CPU: roughly 4.5-7% per hit.
 enemy+=4.5+Math.random()*2.5;
 if(enemy>=100){enemy=100;update();end('enemy');return}
 update();
 timer=setTimeout(enemyHit,55+Math.random()*65);
}
function press(){
 if(!playing){start();return}
 let now=performance.now(),gap=last?now-last:160;last=now;hits++;
 // Rapid tapping is strongly rewarded.
 let gain=gap<75?6.6:gap<105?5.7:gap<140?4.8:gap<190?3.9:gap<260?2.8:1.8;
 power=Math.min(100,power+gain);
 tap.classList.add('down','flash');setTimeout(()=>tap.classList.remove('down','flash'),55);
 status.textContent=gap<85?'🔥🔥 سريع جدًا!':'⚡ اضغط أسرع!';
 if(power>=100){update();end('you');return}
 update();
}
function start(){
 clearTimeout(timer);playing=true;power=0;enemy=0;hits=0;ehits=0;last=0;
 result.textContent='';again.style.display='none';status.textContent='GO! اضغط E بسرعة! 💥';update();
 timer=setTimeout(enemyHit,220);
}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='e'){e.preventDefault();press()}});
tap.addEventListener('pointerdown',e=>{e.preventDefault();press()});
update();
</script>
</body>
</html>
